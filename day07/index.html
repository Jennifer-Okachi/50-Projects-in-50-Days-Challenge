<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="todo-container">
        <header class="header">
            <p class="subtitle">YOUR PERSONAL TASK MANAGER</p>
            <h1>My To-Do List </h1>
            <p class="description">Organize your day, one task at a time.</p>
        </header>
        <section class="stats">
            <div class="stat-card">
                <span id="totalTasks">0</span>
                <p>Total Tasks</p>
            </div>
            <div class="stat-card">
                <span id="pendingTasks">0</span>
                <p>Pending</p>
            </div>
            <div class="stat-card">
                <span id="completedTasks">0</span>
                <p>Completed</p>
            </div>
        </section>
        <form id="todoForm" class="todo-form">
            <input
                type="text"
                id="taskInput"
                placeholder="What do you need to do?"
                autocomplete="off"
                aria-label="Enter a new task"
            >
            <button type="submit" class="add-btn">+ Add Task</button>
        </form>
        <section class="task-section">
            <div class="section-heading">
                <h2>My Tasks</h2>
                <button id="clearCompleted" class="clear-btn" type="button">
                    Clear Completed
                </button>
            </div>
            <ul id="taskList" class="task-list"></ul>
            <p id="emptyMessage" class="empty-message">
                 No tasks yet. Add your first task!
            </p>
        </section>
        <footer>
            <p>Small steps every day lead to big results. </p>
        </footer>
    </main>
     <script src="script.js"></script>
</body>
</html>
